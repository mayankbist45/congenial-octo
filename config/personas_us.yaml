personas:
  balanced_us:
    enabled: true
    description: "Balanced US — GARP on liquid US names via Alpaca"
    strategy_description: >
      US equity book on a curated liquid universe (not S&P 500 membership).
      Orders route to Alpaca paper; Yahoo Finance supplies daily history for scoring.
    capital_usd: 100000
    connectors:
      broker: alpaca
      market_region: US
    fund:
      name: "AI Managed US Equity Fund"
      benchmark_symbol: "^GSPC"
      benchmark_label: "S&P 500"
      base_currency: USD
    universe:
      file: "data/us_liquid.csv"
      min_avg_daily_turnover_inr: 5000000
    execution:
      product_type: "CASH"
      exchange: US
      auto_approve: true
    news:
      feeds:
        - name: "Yahoo Finance"
          url: "https://finance.yahoo.com/news/rssindex"
        - name: "CNBC Top News"
          url: "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=100003114"
        - name: "MarketWatch"
          url: "https://feeds.marketwatch.com/marketwatch/topstories/"

  steady_compounder_us:
    enabled: true
    description: "US low-vol compounder via Alpaca"
    capital_usd: 100000
    connectors:
      broker: alpaca
      market_region: US
    fund:
      name: "US Steady Compounder"
      benchmark_symbol: "^GSPC"
      benchmark_label: "S&P 500"
      base_currency: USD
      target_positions: 20
      max_positions: 25
      min_cash_buffer_pct: 8.0
    universe:
      file: "data/us_liquid.csv"
      min_avg_daily_turnover_inr: 5000000
    risk:
      max_position_pct: 7.0
      max_sector_pct: 20.0
      stop_loss_pct: -12.0
      trailing_stop_pct: -15.0
      max_portfolio_beta: 0.90
      min_portfolio_beta: 0.50
      annual_turnover_budget_pct: 50.0
    quant:
      factor_weights:
        quality: 0.40
        value: 0.25
        growth: 0.20
        momentum: 0.10
        trend: 0.05
      gates:
        max_debt_to_equity: 0.5
        min_roe_pct: 14.0
        max_pe: 50.0
        min_revenue_growth_pct: 5.0
    execution:
      product_type: "CASH"
      exchange: US
      auto_approve: true

  momentum_rider_us:
    enabled: true
    description: "US momentum — ride trends via Alpaca"
    capital_usd: 50000
    connectors:
      broker: alpaca
      market_region: US
    fund:
      name: "US Momentum Rider"
      benchmark_symbol: "^GSPC"
      benchmark_label: "S&P 500"
      base_currency: USD
      target_positions: 15
      max_positions: 20
    universe:
      file: "data/us_liquid.csv"
      min_avg_daily_turnover_inr: 5000000
    risk:
      max_position_pct: 10.0
      max_sector_pct: 30.0
      stop_loss_pct: -10.0
      trailing_stop_pct: -12.0
      annual_turnover_budget_pct: 200.0
      max_portfolio_beta: 1.40
    quant:
      factor_weights:
        quality: 0.10
        value: 0.05
        growth: 0.15
        momentum: 0.45
        trend: 0.25
      min_buy_score: 0.3
      require_above_sma200: true
    cadence:
      monthly_rebalance: true
    execution:
      product_type: "CASH"
      exchange: US
      auto_approve: true

  calan_us:
    enabled: true
    description: "Calan US — SIP-ORB-VWAP intraday via Alpaca"
    strategy_description: >
      US intraday ORB + VWAP on liquid names. Catalyst LLM gate; flat before
      the NYSE close. Paper on Alpaca.
    capital_usd: 50000
    fund:
      name: "Calan US Intraday"
      base_currency: USD
      benchmark_symbol: "^GSPC"
      benchmark_label: "S&P 500"
    connectors:
      broker: alpaca
      market_region: US
    universe:
      file: "data/us_liquid.csv"
      min_avg_daily_turnover_inr: 10000000
    execution:
      product_type: "INTRADAY"
      exchange: US
      auto_approve: false
    intraday:
      enabled: true
      mode: "broker"
      strategies:
        - opening_range_breakout
        - vwap_pullback
      default_interval: "FIVE_MINUTE"
      trade_window_start: "09:45"
      trade_window_end: "15:00"
      force_exit_time: "15:45"
      watch_poll_seconds: 300
      watch_active_poll_seconds: 120
      watch_scan_size: 12
      ranked_universe_size: 8
      max_trades_per_day: 3
      max_open_positions: 2
      risk_per_trade_pct: 0.4
      max_daily_loss_pct: 1.5
      min_avg_volume: 20000
      min_avg_turnover_inr: 10000000
      stocks_in_play:
        min_gap_pct: 0.8
        min_rvol: 1.5
        min_trend_cleanliness: 0.20
        min_trend_at_signal: 0.25
        min_watchlist_trend: 0.25
        min_stop_pct: 0.20
        min_or_range_pct: 0.25
        min_rr_orb: 1.25
        min_rr_vwap: 1.35
      agent:
        enabled: true
        gate_use_llm: false
        catalyst_use_llm: false
        veto_scalping: true
        min_watch_confidence: 0.55
        min_trade_confidence: 0.55
      meta:
        enabled: true
        log_decisions: true
        shadow: true
        min_meta_confidence: 0.55
      kronos:
        enabled: false
        mode: "shadow"
        backend: "local"
        repo_path: "../Kronos"
        model_id: "NeoQuasar/Kronos-small"
        tokenizer_id: "NeoQuasar/Kronos-Tokenizer-base"
        device: "cpu"
        hf_cache_dir: "data/cache/huggingface"
        endpoint_url: ""
        request_timeout_seconds: 15.0
        lookback_bars: 128
        pred_len: 3
        max_context: 512
        min_confidence: 0.55
        score_weight: 12.0
        temperature: 1.0
        top_p: 0.9
        sample_count: 1
      fundamentals:
        enabled: true
        cache_only: true
        high_pe_threshold: 40
        value_pe_threshold: 20
        min_growth_pct: 10
        max_peg_growth: 2.5
        block_value_trap: true
        block_momentum_on_value: true
        growth_confidence_boost: 0.05
        value_confidence_penalty: 0.08

  mayank_us:
    enabled: true
    description: "Mayank US — growth→momentum, value→fade via Alpaca"
    strategy_description: >
      US hybrid book on liquid names. Classifies growth vs value from P/E, PEG,
      and earnings growth, then routes growth to ORB/VWAP/scalping and value to
      mean-reversion fades. Paper on Alpaca.
    capital_usd: 50000
    fund:
      name: "Mayank US Intraday"
      base_currency: USD
      benchmark_symbol: "^GSPC"
      benchmark_label: "S&P 500"
    connectors:
      broker: alpaca
      market_region: US
    universe:
      file: "data/us_liquid.csv"
      min_avg_daily_turnover_inr: 10000000
    execution:
      product_type: "INTRADAY"
      exchange: US
      auto_approve: false
    intraday:
      enabled: true
      mode: "broker"
      strategies:
        - opening_range_breakout
        - vwap_pullback
        - scalping
        - vwap_fade
        - opening_gap_fade
      default_interval: "FIVE_MINUTE"
      trade_window_start: "09:45"
      trade_window_end: "15:00"
      force_exit_time: "15:45"
      watch_poll_seconds: 300
      watch_active_poll_seconds: 120
      watch_scan_size: 12
      ranked_universe_size: 10
      max_trades_per_day: 4
      max_open_positions: 2
      risk_per_trade_pct: 0.35
      max_daily_loss_pct: 1.5
      max_position_value_pct: 20.0
      min_avg_volume: 20000
      min_avg_turnover_inr: 10000000
      min_atr_pct: 0.6
      min_fade_vwap_pct: 1.0
      volume_spike_multiple: 1.2
      opening_range_minutes: 15
      stop_buffer_pct: 0.05
      target_r_multiple: 1.5
      trailing_stop_pct: 0.25
      stocks_in_play:
        min_gap_pct: 0.8
        min_rvol: 1.5
        min_trend_cleanliness: 0.20
        min_trend_at_signal: 0.25
        min_watchlist_trend: 0.25
        min_stop_pct: 0.20
        min_or_range_pct: 0.25
        min_rr_orb: 1.25
        min_rr_vwap: 1.35
        min_rr_scalping: 1.25
      agent:
        enabled: true
        catalyst_use_llm: false
        gate_use_llm: false
        veto_scalping: false
        min_watch_confidence: 0.55
        min_trade_confidence: 0.58
      fundamentals:
        enabled: true
        cache_only: true
        high_pe_threshold: 40
        value_pe_threshold: 20
        min_growth_pct: 10
        max_peg_growth: 2.5
        allow_value_trap: false
        block_value_trap: true
        block_momentum_on_value: false
        growth_confidence_boost: 0.05
        value_confidence_penalty: 0.05

  revert_us:
    enabled: false
    description: "Revert US — VWAP/gap fade intraday via Alpaca"
    capital_usd: 30000
    fund:
      base_currency: USD
      benchmark_symbol: "^GSPC"
      benchmark_label: "S&P 500"
    connectors:
      broker: alpaca
      market_region: US
    universe:
      file: "data/us_liquid.csv"
      min_avg_daily_turnover_inr: 10000000
    execution:
      product_type: "INTRADAY"
      exchange: US
      auto_approve: false
    intraday:
      enabled: true
      mode: "broker"
      strategies:
        - vwap_fade
        - opening_gap_fade
      trade_window_start: "09:45"
      trade_window_end: "14:00"
      force_exit_time: "15:45"
      min_avg_volume: 20000
      max_trades_per_day: 4
      risk_per_trade_pct: 0.25
      stocks_in_play:
        max_gap_pct: 1.0
        max_trend_cleanliness: 0.40
      agent:
        enabled: true
        min_watch_confidence: 0.55
        min_trade_confidence: 0.55

  flux_us:
    enabled: false
    description: "Flux US — OFI proxy intraday via Alpaca"
    capital_usd: 20000
    fund:
      base_currency: USD
      benchmark_symbol: "^GSPC"
      benchmark_label: "S&P 500"
    connectors:
      broker: alpaca
      market_region: US
    universe:
      file: "data/us_liquid.csv"
    execution:
      product_type: "INTRADAY"
      exchange: US
      auto_approve: false
    intraday:
      enabled: true
      mode: "broker"
      strategies:
        - ofi_momentum
        - ofi_exhaustion
      default_interval: "ONE_MINUTE"
      watch_poll_seconds: 60
      trade_window_start: "09:45"
      trade_window_end: "14:00"
      force_exit_time: "15:45"
      min_avg_volume: 20000
      agent:
        enabled: true
        min_watch_confidence: 0.50
        min_trade_confidence: 0.50

  spread_us:
    enabled: false
    description: "Spread US — intraday pairs via Alpaca"
    capital_usd: 40000
    fund:
      base_currency: USD
      benchmark_symbol: "^GSPC"
      benchmark_label: "S&P 500"
    connectors:
      broker: alpaca
      market_region: US
    universe:
      file: "data/us_liquid.csv"
    execution:
      product_type: "INTRADAY"
      exchange: US
      auto_approve: false
    intraday:
      enabled: true
      mode: "broker"
      strategies:
        - pair_zscore
      pairs:
        - [JPM, BAC]
        - [AAPL, MSFT]
        - [XOM, CVX]
      trade_window_start: "09:45"
      trade_window_end: "14:00"
      force_exit_time: "15:45"
      min_avg_volume: 20000
      agent:
        enabled: true
        min_watch_confidence: 0.50
        min_trade_confidence: 0.50

  slice_us:
    enabled: false
    description: "Slice US — TWAP/VWAP execution via Alpaca"
    capital_usd: 100000
    fund:
      base_currency: USD
      benchmark_symbol: "^GSPC"
      benchmark_label: "S&P 500"
    connectors:
      broker: alpaca
      market_region: US
    universe:
      file: "data/us_liquid.csv"
    execution:
      product_type: "INTRADAY"
      exchange: US
      auto_approve: false
    intraday:
      enabled: true
      mode: "broker"
      strategies:
        - twap_slice
        - vwap_schedule
      parent_orders: []
      min_avg_volume: 20000
      agent:
        enabled: true
