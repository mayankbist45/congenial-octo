id: crypto_momentum_paper
enabled: false
description: "Crypto momentum paper trader on Alpaca spot"
strategy_description: >
  Spot crypto intraday paper bot on a small liquid USD universe. Long-only,
  flat by the end of the synthetic US session, and uses Alpaca crypto data.
capital_usd: 25000
connectors:
  broker: alpaca_crypto
  market_region: US
fund:
  name: "Crypto Momentum Paper"
  base_currency: USD
  benchmark_symbol: "BTC/USD"
  benchmark_label: "Bitcoin"
universe:
  file: "data/crypto_us.csv"
execution:
  product_type: "CASH"
  exchange: CRYPTO
  auto_approve: false
intraday:
  enabled: true
  mode: "paper"
  strategies:
    - opening_range_breakout
    - vwap_pullback
  default_interval: "FIVE_MINUTE"
  trade_window_start: "09:15"
  trade_window_end: "16:00"
  force_exit_time: "16:55"
  watch_poll_seconds: 300
  watch_active_poll_seconds: 120
  watch_scan_size: 3
  ranked_universe_size: 3
  max_trades_per_day: 3
  max_open_positions: 2
  risk_per_trade_pct: 0.35
  max_position_value_pct: 25.0
  max_daily_loss_pct: 1.5
  min_avg_volume: 0
  min_avg_turnover_inr: 0
  quantity_step: 0.0001
  quantity_decimals: 4
  allow_short: false
  stocks_in_play:
    min_gap_pct: 0.4
    min_rvol: 1.1
    min_trend_cleanliness: 0.10
    min_trend_at_signal: 0.10
    min_watchlist_trend: 0.10
    min_stop_pct: 0.20
    min_or_range_pct: 0.20
    min_rr_orb: 1.20
    min_rr_vwap: 1.25
  costs:
    brokerage_pct: 0.0
    brokerage_cap_per_order: 0.0
    stt_sell_pct: 0.0
    exchange_txn_pct: 0.0
    sebi_pct: 0.0
    stamp_buy_pct: 0.0
    gst_pct: 0.0
  agent:
    enabled: true
    gate_use_llm: false
    catalyst_use_llm: false
    veto_scalping: true
    min_watch_confidence: 0.50
    min_trade_confidence: 0.50
  meta:
    enabled: true
    log_decisions: true
    shadow: true
    min_meta_confidence: 0.50
