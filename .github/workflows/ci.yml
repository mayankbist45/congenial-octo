name: CI

on:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest -q

  postgres-agent-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mutualfund_test
          POSTGRES_USER: fund_test
          POSTGRES_PASSWORD: fund_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fund_test -d mutualfund_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FUND_TEST_DB_URL: postgresql://fund_test:fund_test@localhost:5432/mutualfund_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run durable agent tests
        run: python -m pytest tests/test_agent_runtime.py tests/test_agent_contracts.py -q
