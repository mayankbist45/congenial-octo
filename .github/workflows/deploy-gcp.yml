name: Deploy To GCP

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_mode:
        description: Which deployment path to run
        required: true
        default: push
        type: choice
        options:
          - push
          - bootstrap
          - deploy

concurrency:
  group: deploy-gcp-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
  GCP_PROJECT: ${{ vars.GCP_PROJECT }}
  GCP_ZONE: ${{ vars.GCP_ZONE }}
  GCP_INSTANCE: ${{ vars.GCP_INSTANCE }}
  GCP_BACKUP_BUCKET: ${{ vars.GCP_BACKUP_BUCKET }}
  FUND_GCLOUD_QUIET: "1"

jobs:
  deploy:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide deployment path
        id: plan
        shell: bash
        run: |
          set -euo pipefail

          deploy_mode="push"
          should_bootstrap="false"

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            deploy_mode="${{ inputs.deploy_mode }}"
            case "${deploy_mode}" in
              deploy|bootstrap)
                should_bootstrap="true"
                ;;
            esac
          else
            before_sha="${{ github.event.before }}"
            if [ -z "${before_sha}" ] || [ "${before_sha}" = "0000000000000000000000000000000000000000" ]; then
              should_bootstrap="true"
            else
              changed_files="$(git diff --name-only "${before_sha}" "${GITHUB_SHA}")"
              printf 'Changed files since %s:\n%s\n' "${before_sha}" "${changed_files:-<none>}"
              if printf '%s\n' "${changed_files}" | grep -Eq '^(requirements\.txt|Dockerfile\.agent-worker|deploy/|scripts/bootstrap_vm\.sh|scripts/deploy_gcp\.sh|scripts/generate_schedule\.py|config/markets/)'; then
                should_bootstrap="true"
              fi
            fi
          fi

          echo "deploy_mode=${deploy_mode}" >> "${GITHUB_OUTPUT}"
          echo "should_bootstrap=${should_bootstrap}" >> "${GITHUB_OUTPUT}"
          echo "Deploy mode: ${deploy_mode}"
          echo "Should bootstrap: ${should_bootstrap}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT }}

      - name: Validate GCP access
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth list
          gcloud config get-value project
          gcloud compute instances describe "${GCP_INSTANCE}" --zone "${GCP_ZONE}" --format='value(name,status,zone)'

      - name: Initial create and bootstrap
        if: steps.plan.outputs.deploy_mode == 'deploy'
        shell: bash
        run: ./scripts/deploy_gcp.sh deploy

      - name: Push latest code
        if: steps.plan.outputs.deploy_mode != 'deploy'
        shell: bash
        run: ./scripts/deploy_gcp.sh push

      - name: Re-bootstrap VM
        if: steps.plan.outputs.deploy_mode != 'deploy' && steps.plan.outputs.should_bootstrap == 'true'
        shell: bash
        run: ./scripts/deploy_gcp.sh bootstrap
